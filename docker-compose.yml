version: '3'

services:
  api:
    image: ${IMAGE_NAME}/api:latest
    environment:
      - SPOTIFY_CALLBACK_URL=https://tangerie.xyz/mixr/spotify/callback
    volumes:
      - ./api/Data:/app/Data
    deploy:
      replicas: 1
      labels:
        xyz.tangerie.reverse_proxy.path: "/mixr/api"
        xyz.tangerie.reverse_proxy.port: "80"
    networks:
      - nginx-proxy-overlay

  web:
    image: ${IMAGE_NAME}/web:latest
    depends_on:
      - api
    deploy:
      replicas: 1
      labels:
        xyz.tangerie.reverse_proxy.path: "/mixr"
        xyz.tangerie.reverse_proxy.port: "3000"
    networks:
      - nginx-proxy-overlay

networks:
  nginx-proxy-overlay:
    driver: overlay
    external: true
